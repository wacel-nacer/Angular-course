<section class="form-page">
  <a routerLink="/list">← Retour aux conférences</a>
  <h1>{{ editingId ? 'Modifier' : 'Ajouter' }} une conférence</h1>
  @if (error) { <p class="error">{{ error }}</p> }
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="title">Titre *</label>
    <input id="title" formControlName="title" />
    <label for="description">Description *</label>
    <textarea id="description" rows="4" formControlName="description"></textarea>
    <small>{{ characterCount() }} caractères</small>
    <label for="location">Lieu *</label>
    <input id="location" formControlName="location" />
    <label for="date">Date *</label>
    <input id="date" type="date" formControlName="date" />
    <label for="price">Prix *</label>
    <input id="price" type="number" formControlName="price" />
    <label for="nbPlaces">Nombre de places *</label>
    <input id="nbPlaces" type="number" formControlName="nbPlaces" />
    <button type="submit" [disabled]="form.invalid || saving">
      {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
    </button>
  </form>
</section>
